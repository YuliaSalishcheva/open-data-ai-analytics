services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: analytics_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d analytics_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  data_load:
    build: ./data_load
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/analytics_db

  quality:
    build: ./data_quality_analysis
    depends_on:
      data_load:
        condition: service_completed_successfully
    volumes:
      - ./reports:/app/reports
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/analytics_db

  research:
    build: ./data_research
    depends_on:
      data_load:
        condition: service_completed_successfully
    volumes:
      - ./reports:/app/reports
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/analytics_db

  visualization:
    build: ./visualization
    depends_on:
      data_load:
        condition: service_completed_successfully
    volumes:
      - ./reports/figures:/app/plots
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/analytics_db

  web:
    build: ./web
    ports:
      - "8080:5000"
    depends_on:
      - db
    volumes:
      - ./reports/figures:/app/static/plots:ro
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/analytics_db

networks:
  default:
    name: analytics_network