<!DOCTYPE html>
<html>
<head>
    <title>Аналітика Даних</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <h1>Звіт за результатами аналізу</h1>
    <hr>

    <h3>Результати дослідження</h3>
    <div class="border p-3 bg-light">
        {{ data_table | safe }}
    </div>

    <h3 class="mt-4">Візуалізація</h3>
    <div class="row">
        {% for plot in plots %}
        <div class="col-md-4">
            <img src="{{ url_for('static', filename='plots/' + plot) }}" class="img-fluid border">
        </div>
        {% endfor %}
    </div>
</body>
</html>
